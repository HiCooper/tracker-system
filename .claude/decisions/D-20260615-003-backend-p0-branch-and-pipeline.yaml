id: "D-20260615-003"
timestamp: "2026-06-15T08:10:00"
topic: "后端 submodule P0 修复的分支/推送策略,以及采集持久化路径(结构修正 C)"
context: >
  本会话需修复 tracker-service / tracker-admin 两个 submodule 的 P0。环境无 SSH、git push 无凭据,
  但 GitHub MCP 已以仓库 owner(HiCooper)身份授权,且本地 git 代理(127.0.0.1)同时服务三个仓库。
  同时需决定采集是否启用 Kafka 持久化路径。
chosen: >
  - 推送方式:将 submodule 的 origin 改写为本地 git 代理 URL,在各自仓库建分支 claude/backend-p0-fixes
    直接 push 并经 MCP 提 PR;不改父仓库 submodule 指针(遵循交接约束)。
  - 持久化路径:启用 Kafka 为主(削峰/可重放),Kafka 失败降级同步写 ClickHouse,再失败才进 DLQ;
    新增开关 tracker.pipeline.async-kafka(默认 true)以便运维回退同步。
  - DLQ 单一所有权:ClickHouseWriter 只抛异常不自写 DLQ,消除与调用方双写。
rejected:
  - "用 MCP push_files 逐文件提交: 12+ 文件内联内容过重,易错;本地 git 代理可直接 push 更可靠"
  - "同步写为主、Kafka 注释保留: 无削峰/不可重放,崩溃即丢,违背评估的结构修正 C"
  - "ClickHouseWriter 内部写 DLQ: 与 EventController/EventCollector 双写,难以单点治理"
rationale: >
  owner 身份 + 本地代理使 git push 成为最低摩擦且可审计的路径;Kafka 主+同步兜底在不牺牲可靠性的
  前提下满足削峰与可重放,开关保证可回退;DLQ 单点便于观测与排障。
constraints_ref:
  - "launch-readiness-assessment.md §1 结构修正 C / §3.3 P0"
  - "constraints.yaml: api_backward_compat(采集契约未破坏)"
impact:
