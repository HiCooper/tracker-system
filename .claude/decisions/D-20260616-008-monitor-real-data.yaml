topic: "MonitorController 接真实数据,替换桩数据"
context: >
  管理端监控页约 90% 为桩数据(ClickHouse 健康恒报 UP、pipeline/dataQuality/errors 全 0),
  误导运维。需在不破坏前端契约、无新基础设施的前提下接真实数据。
chosen: >
