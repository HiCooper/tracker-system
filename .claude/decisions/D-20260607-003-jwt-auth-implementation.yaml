id: "D-20260607-003"
timestamp: "2026-06-07T22:00:00"
topic: "JWT 认证实现 — Spring Security + jjwt 0.12.x"
context: |
  系统所有 API 端点均未保护。需要为 tracker-admin 添加 JWT 认证，
  同时保持 tracker-service 的 /api/v1/collect 端点对外开放给 SDK。

chosen: |
  Spring Security + jjwt 0.12.x，无状态 JWT 认证。
  - Backend: SecurityConfig 使用 SecurityFilterChain DSL，JwtAuthFilter 作为 OncePerRequestFilter
  - 令牌: 签名密钥通过 jwt.secret 配置，默认 24 小时过期
  - 用户存储: MySQL tracker_user 表，通过 JdbcTemplate 查询
  - 默认管理员: DataInitializer CommandLineRunner 在启动时创建 admin/admin123
  - 前端: AuthGuard 组件包装所有受保护路由，api.ts 拦截器注入 Bearer 令牌及 401 重定向

rejected:
  - "Session-based auth: 违反无状态架构，增加服务端复杂度"

rationale: |
  - jjwt 0.12.x 是纯 Java 实现，无需额外依赖
  - JdbcTemplate 用于简单用户查询，避免为单表创建完整 MyBatis 映射器
  - Flyway 保持禁用状态，V5 迁移手动执行

constraints_ref:
  - "tracker-service /api/v1/collect 必须保持开放"
  - "无状态 — 无服务端 session"

impact:
