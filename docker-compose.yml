# GateFlow Tracker System — 完整本地/演示环境（一键启动全栈）
# 启动:  docker compose up -d --build
# 访问:  前端 http://localhost:8080  ·  admin API http://localhost:8082
#        采集服务 http://localhost:8088  ·  Swagger http://localhost:8082/swagger-ui.html

services:
  mysql:
    image: mysql:8.0
    container_name: tracker-mysql
    environment:
      MYSQL_ROOT_PASSWORD: tracker123
      MYSQL_DATABASE: tracker_admin
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptracker123"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: tracker-clickhouse
    environment:
      CLICKHOUSE_DB: gateflow_tracker
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse-init:/docker-entrypoint-initdb.d
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tracker-redis
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    container_name: tracker-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 三套监听器: 容器内(PLAINTEXT) / 控制器 / 宿主机(EXTERNAL)
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["29092:29092"]
    volumes: [kafka_data:/bitnami/kafka]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  tracker-service:
    build:
      context: ./backend/tracker-service
      dockerfile: ../../docker/tracker-service.Dockerfile
    container_name: tracker-service
    ports: ["8088:8088"]
    environment:
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/gateflow_tracker
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  tracker-admin:
    build:
      context: ./backend/tracker-admin
      dockerfile: ../../docker/tracker-admin.Dockerfile
    container_name: tracker-admin
    ports: ["8082:8082"]
    environment:
      TRACKER_DB_URL: jdbc:mysql://mysql:3306/tracker_admin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      TRACKER_DB_USER: root
      TRACKER_DB_PASSWORD: tracker123
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 监控页拉取采集服务 DLQ 等指标
      TRACKER_SERVICE_BASE_URL: http://tracker-service:8088
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  admin-frontend:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: tracker-admin-frontend
    ports: ["8080:80"]
    depends_on:
      - tracker-admin
      - tracker-service
    restart: unless-stopped

volumes:
  mysql_data:
  clickhouse_data:
  redis_data:
  kafka_data:
